<mat-card
    class="flex flex-col w-full bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">


    <div
        class="p-6 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-900/50">
        <h3 class="text-xl font-bold text-gray-800 dark:text-white">
            Registros de Usuários
        </h3>
    </div>

    <!-- Área de Conteúdo -->
    <div class="p-6 flex flex-col flex-auto">

        <!-- Loading State -->
        <div *ngIf="loading" class="flex items-center justify-center h-80">
            <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
        </div>

        <apx-chart *ngIf="!loading && chartOptions" class="flex-auto w-full" [series]="chartOptions.series"
            [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis" [yaxis]="chartOptions.yaxis"
            [stroke]="chartOptions.stroke" [grid]="chartOptions.grid" [dataLabels]="chartOptions.dataLabels"
            [tooltip]="chartOptions.tooltip">
        </apx-chart>
    </div>
</mat-card>
