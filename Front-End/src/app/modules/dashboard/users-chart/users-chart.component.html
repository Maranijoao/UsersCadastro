<!-- Card container com cores de fundo e texto para ambos os temas -->
<div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow w-full h-full flex flex-col min-h-[440px]">
    <ng-container *ngIf="!loading; else loadingTemplate">
        <div id="chart" class="flex-auto -mb-6">
            <apx-chart
                [series]="chartOptions.series"
                [chart]="chartOptions.chart"
                [xaxis]="chartOptions.xaxis"
                [yaxis]="chartOptions.yaxis"
                [title]="chartOptions.title"
                [stroke]="chartOptions.stroke"
                [grid]="chartOptions.grid"
                [dataLabels]="chartOptions.dataLabels"
                [tooltip]="chartOptions.tooltip"
            ></apx-chart>
        </div>
    </ng-container>

    <!-- Template de loading com cores para ambos os temas -->
    <ng-template #loadingTemplate>
        <div class="flex items-center justify-center h-full">
            <div class="text-center text-gray-500 dark:text-gray-400">
                <mat-progress-spinner [diameter]="32" [mode]="'indeterminate'"></mat-progress-spinner>
                <p class="mt-4 text-sm font-semibold">Carregando dados do gráfico...</p>
            </div>
        </div>
    </ng-template>
</div>
