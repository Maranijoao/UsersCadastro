<div class="h-full w-64 bg-white dark:bg-gray-900 flex flex-col p-4 shadow-lg border-r dark:border-gray-700">
  <div class="pb-4 border-b dark:border-gray-700">
    <div class="text-3xl font-bold ml-2 text-gray-800 dark:text-gray-100 mb-2 pb-4">
      Usuários
    </div>
    <button routerLink="/clientes/novo"
      class="w-full mt-4 px-4 py-2 rounded-full bg-blue-500 hover:bg-blue-600 text-white font-medium shadow mb-4">
      Novo Usuário
    </button>

    <div class="flex-1 flex flex-col justify-between pt-6">
      <div class="flex items-center justify-between mb-4">
        <span class="text-lg font-semibold text-gray-700 dark:text-gray-300">Filtros</span>
        <button (click)="clearFilters()"
          class="px-4 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 font-medium rounded-full shadow-sm text-sm transition-colors duration-200">
          Limpar
        </button>
      </div>

      <div class="flex flex-col space-y-4">

        <mat-form-field appearance="fill"
          class="[&_.mdc-line-ripple]:hidden 
                 [&_.mat-mdc-form-field-flex]:bg-white [&_.mat-mdc-form-field-flex]:dark:bg-gray-900
                 [&_.mat-mdc-form-field-flex]:rounded-lg 
                 [&_.mat-mdc-floating-label]:text-gray-600 [&_.mat-mdc-floating-label]:dark:text-gray-400
                 [&_.mat-mdc-select-arrow]:text-gray-600 [&_.mat-mdc-select-arrow]:dark:text-gray-400">
          <mat-label class="text-gray-600 dark:text-gray-400">Tipo</mat-label>
          <mat-select [(ngModel)]="selectedRole" (selectionChange)="onFilterChange()" panelClass="dark-filter-panel"
            class="text-gray-800 dark:text-gray-200">
            <mat-option value="all">Todos</mat-option>
            <mat-option value="user">Usuário</mat-option>
            <mat-option value="admin">Administrador</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill"
          class="[&_.mdc-line-ripple]:hidden 
                 [&_.mat-mdc-form-field-flex]:bg-white [&_.mat-mdc-form-field-flex]:dark:bg-gray-900
                 [&_.mat-mdc-form-field-flex]:rounded-lg 
                 [&_.mat-mdc-floating-label]:text-gray-600 [&_.mat-mdc-floating-label]:dark:text-gray-400
                 [&_.mat-mdc-select-arrow]:text-gray-600 [&_.mat-mdc-select-arrow]:dark:text-gray-400">
          <mat-label class="text-gray-600 dark:text-gray-400">Status</mat-label>
          <mat-select [(ngModel)]="selectedStatus" (selectionChange)="onFilterChange()" panelClass="dark-filter-panel"
            class="text-gray-800 dark:text-gray-200">
            <mat-option value="all">Todos</mat-option>
            <mat-option value="active">Ativo</mat-option>
            <mat-option value="inactive">Inativo</mat-option>
          </mat-select>
        </mat-form-field>

      </div>
    </div>
  </div>
</div>
