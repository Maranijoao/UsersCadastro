<div class="absolute flex flex-row w-full inset-0 bg-white dark:bg-gray-900">

  @if(isAdmin) {
  <app-sidebar (statusFilterChange)="onStatusFilterChanged($event)" (roleFilterChange)="onRoleFilterChanged($event)">
  </app-sidebar>
  }

  <div class="flex w-full h-full lg:w-[28rem] flex-col border-r dark:border-gray-700">

    <div class="p-4 border-b border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-900 flex flex-col gap-3">
      
      <div class="relative w-full">
    <mat-icon class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-200 h-5 w-5"
      [svgIcon]="'heroicons_outline:magnifying-glass'"></mat-icon>
    <input type="text"
      class="w-full rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-transparent py-2 pl-10 pr-3 text-sm outline-none focus:ring-2 focus:ring-primary-500 text-gray-700 dark:text-gray-200 placeholder-gray-500 dark:placeholder:text-gray-400"
      placeholder="Buscar usuários..." [(ngModel)]="search" (ngModelChange)="onSearchChanged()">
  </div>

      <div class="border-t dark:border-gray-700 bg-white dark:bg-gray-900">
        <mat-paginator 
      [length]="pagination?.totalCount || 0" 
      [pageSize]="pageSize" 
      [pageIndex]="pageNumber - 1"
      [pageSizeOptions]="pageSizeOptions" 
      (page)="onPageChange($event)" 
      showFirstLastButtons 
      hidePageSize="true"
      aria-label="Selecione a página de usuários" 
      class="bg-transparent compact-paginator"> </mat-paginator>
      </div>
    </div>

    <div *ngIf="loading"
      class="p-2 text-center text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800">
      Carregando...
    </div>

    <div class="flex-1 overflow-y-auto">
      <ng-container *ngIf="filtered?.length; else vazio">
        <button *ngFor="let c of filtered; trackBy: trackById" (click)="select(c)"
          class="w-full text-left border-b border-gray-50 dark:border-gray-800 last:border-0">
          <div
            class="relative flex items-center gap-3 px-4 py-4 hover:bg-slate-50 dark:hover:bg-gray-700/50 transition-colors"
            [class.bg-sky-50]="selectedId === c.id" [class.dark:bg-sky-900]="selectedId === c.id"
            [class.border-l-4]="selectedId === c.id" [class.border-l-sky-500]="selectedId === c.id">

            <div class="relative">
              <div
                class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-200 dark:bg-gray-600 font-semibold text-slate-700 dark:text-gray-200">
                {{ getInitial(c.name) }}
              </div>
              <span class="absolute -bottom-0.5 -right-0.5 h-3 w-3 rounded-full ring-2 ring-white dark:ring-gray-800"
                [class]="statusDotClass(c.recordStatus)" [title]="c.recordStatus ? 'Ativo' : 'Inativo'"></span>
            </div>

            <div class="min-w-0 flex-1">
              <div class="font-medium truncate text-gray-800 dark:text-gray-100">{{ c.name }}</div>
              <div class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ c.email }}</div>
            </div>

            <div class="whitespace-nowrap rounded-full px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-wide"
              [class]="roleBadgeClass(c.role)">
              {{ (c.role || 'user') }}
            </div>
          </div>
        </button>
      </ng-container>

      <ng-template #vazio>
        <div class="flex flex-col items-center justify-center h-40 text-slate-500 dark:text-slate-400">
          <mat-icon class="icon-size-8 mb-2" [svgIcon]="'heroicons_outline:users'"></mat-icon>
          <span class="text-sm">Nenhum usuário encontrado</span>
        </div>
      </ng-template>
    </div>
  </div>

  <div class="flex w-full h-full overflow-hidden bg-gray-50 dark:bg-gray-800/50">
    <router-outlet></router-outlet>
  </div>
</div>
